name: TWRP Device Tree Fix and Preflight

on:
  push:
    branches:
      - master
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: "Verified stock recovery image URL"
        required: true
        default: "https://github.com/FeaturedPr0ject/GernelOStest/releases/download/Recovery/recovery-original.img"
      IMG_SHA256:
        description: "Expected SHA-256"
        required: true
        default: "fea18b7c5c771054aec49559b09162be56dcc504667866fb2ffed54618886c07"

permissions:
  contents: read

jobs:
  fix-device-tree:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install recovery image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpio
          python -m pip install --upgrade pip
          python -m pip install twrpdtgen

      - name: Test device tree correction script
        run: |
          set -euo pipefail
          python -m py_compile scripts/build.py scripts/fix_device_tree.py tests/test_fix_device_tree.py
          python -m unittest discover -s tests -v

      - name: Download and verify stock recovery
        env:
          IMG_URL: ${{ inputs.IMG_URL || 'https://github.com/FeaturedPr0ject/GernelOStest/releases/download/Recovery/recovery-original.img' }}
          IMG_SHA256: ${{ inputs.IMG_SHA256 || 'fea18b7c5c771054aec49559b09162be56dcc504667866fb2ffed54618886c07' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IMG_URL" --output recovery-original.img
          echo "$IMG_SHA256  recovery-original.img" | sha256sum --check
          test "$(stat --format=%s recovery-original.img)" -eq 33554432

      - name: Generate device tree from stock recovery
        run: |
          set -euo pipefail
          python scripts/build.py --input recovery-original.img --output generated-device-tree
          find generated-device-tree -maxdepth 5 -type f -print | sort

      - name: Correct and validate device tree
        run: |
          set -euo pipefail
          python scripts/fix_device_tree.py --root generated-device-tree
          test -f generated-device-tree/tcl/apollo2/DEVICE_TREE_FIX_REPORT.txt
          grep -nE '^(TARGET_ARCH := arm|TARGET_BOARD_PLATFORM := mt6761|BOARD_SUPER_PARTITION_SIZE := 4949278720|BOARD_SUPER_PARTITION_GROUPS := main|BOARD_MAIN_SIZE := 4947181568|BOARD_MAIN_PARTITION_LIST := system vendor product odm oem)          grep -n '/dev/block/mmcblk0p16' generated-device-tree/tcl/apollo2/recovery.fstab
          find generated-device-tree/tcl/apollo2 -maxdepth 5 -type f -print | sort

      - name: Upload corrected device tree
        uses: actions/upload-artifact@v4
        with:
          name: alcatel-9032x-device-tree-fixed
          path: generated-device-tree/
          if-no-files-found: error
          retention-days: 14
