name: TWRP Device Tree Preflight

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'Verified stock recovery image URL'
        required: true
        default: 'https://github.com/FeaturedPr0ject/GernelOStest/releases/download/Recovery/recovery-original.img'
      IMG_SHA256:
        description: 'Expected SHA-256'
        required: true
        default: 'fea18b7c5c771054aec49559b09162be56dcc504667866fb2ffed54618886c07'

permissions:
  contents: read

jobs:
  generate-device-tree:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install device tree generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install twrpdtgen

      - name: Download and verify stock recovery
        env:
          IMG_URL: ${{ inputs.IMG_URL }}
          IMG_SHA256: ${{ inputs.IMG_SHA256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IMG_URL" --output recovery-original.img
          echo "$IMG_SHA256  recovery-original.img" | sha256sum --check
          test "$(stat --format=%s recovery-original.img)" -eq 33554432

      - name: Generate device tree
        run: |
          set -euo pipefail
          python scripts/build.py --input recovery-original.img --output generated-device-tree
          find generated-device-tree -maxdepth 5 -type f -print | sort
          grep -RniE 'TARGET_ARCH|TARGET_2ND_ARCH|BOARD_KERNEL|AB_OTA|super|dynamic|fstab|arm64|arm32' generated-device-tree || true

      - name: Upload generated device tree for review
        uses: actions/upload-artifact@v4
        with:
          name: alcatel-9032x-device-tree-preflight
          path: generated-device-tree/
          if-no-files-found: error
          retention-days: 14
