name: Build TWRP 11 Recovery

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/Recovery Build (Legacy).yml"
      - "scripts/**"
      - "tests/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: "Verified stock recovery image URL"
        required: true
        default: "https://github.com/FeaturedPr0ject/GernelOStest/releases/download/Recovery/recovery-original.img"
      IMG_SHA256:
        description: "Expected SHA-256"
        required: true
        default: "fea18b7c5c771054aec49559b09162be56dcc504667866fb2ffed54618886c07"

permissions:
  contents: read

jobs:
  build-twrp:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space and add swap
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Check out device tree scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop pngcrush python3 python3-pip python-is-python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev cpio
          df -h /

      - name: Set up Python device-tree generator
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install device-tree generator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install twrpdtgen

      - name: Download and verify stock recovery
        env:
          IMG_URL: ${{ inputs.IMG_URL || 'https://github.com/FeaturedPr0ject/GernelOStest/releases/download/Recovery/recovery-original.img' }}
          IMG_SHA256: ${{ inputs.IMG_SHA256 || 'fea18b7c5c771054aec49559b09162be56dcc504667866fb2ffed54618886c07' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$IMG_URL" --output recovery-original.img
          echo "$IMG_SHA256  recovery-original.img" | sha256sum --check
          test "$(stat --format=%s recovery-original.img)" -eq 33554432

      - name: Generate and correct Apollo2 device tree
        run: |
          set -euo pipefail
          python -m py_compile scripts/build.py scripts/fix_device_tree.py
          python scripts/build.py --input recovery-original.img --output generated-device-tree
          python scripts/fix_device_tree.py --root generated-device-tree
          DEVICE_DIR="generated-device-tree/tcl/apollo2"
          test -f "$DEVICE_DIR/BoardConfig.mk"
          test -f "$DEVICE_DIR/recovery.fstab"
          test -f "$DEVICE_DIR/prebuilt/kernel"
          test -f "$DEVICE_DIR/prebuilt/dtb.img"
          test -f "$DEVICE_DIR/prebuilt/dtbo.img"
          grep -q '/dev/block/mmcblk0p16 /metadata' "$DEVICE_DIR/recovery.fstab"
          python - <<'PY'
          from pathlib import Path

          device = Path("generated-device-tree/tcl/apollo2")
          old_product = device / "omni_apollo2.mk"
          new_product = device / "twrp_apollo2.mk"
          if not old_product.is_file():
              raise SystemExit("Expected generated omni_apollo2.mk was not found")
          product_text = old_product.read_text(encoding="utf-8")
          product_text = product_text.replace("vendor/omni/config/common.mk", "vendor/twrp/config/common.mk")
          product_text = product_text.replace("omni_apollo2", "twrp_apollo2")
          new_product.write_text(product_text, encoding="utf-8")
          old_product.unlink()

          for name in ("AndroidProducts.mk", "vendorsetup.sh"):
              path = device / name
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("omni_apollo2", "twrp_apollo2"), encoding="utf-8")

          products = (device / "AndroidProducts.mk").read_text(encoding="utf-8")
          setup = (device / "vendorsetup.sh").read_text(encoding="utf-8")
          product = new_product.read_text(encoding="utf-8")
          if "twrp_apollo2-eng" not in products or "twrp_apollo2-eng" not in setup:
              raise SystemExit("TWRP lunch target was not registered")
          if "PRODUCT_NAME := twrp_apollo2" not in product:
              raise SystemExit("TWRP product name was not converted")
          if "vendor/twrp/config/common.mk" not in product:
              raise SystemExit("TWRP common product config was not selected")
          PY
          python - <<'PY'
          import re
          from pathlib import Path

          board = Path("generated-device-tree/tcl/apollo2/BoardConfig.mk")
          text = board.read_text(encoding="utf-8")
          required = {
              "TARGET_ARCH": "arm",
              "TARGET_BOARD_PLATFORM": "mt6761",
              "BOARD_RECOVERYIMAGE_PARTITION_SIZE": "33554432",
              "BOARD_SUPER_PARTITION_SIZE": "4949278720",
              "BOARD_SUPER_PARTITION_GROUPS": "main",
              "BOARD_MAIN_SIZE": "4947181568",
              "BOARD_MAIN_PARTITION_LIST": "system vendor product odm oem",
          }
          for name, value in required.items():
              pattern = rf"^\\s*{re.escape(name)}\\s*:=\\s*{re.escape(value)}\\s*$"
              if not re.search(pattern, text, re.MULTILINE):
                  raise SystemExit(f"BoardConfig validation failed: {name} must be {value}")
          print("BoardConfig hardware and partition validation: passed")
          PY
          grep -n 'twrp_apollo2' "$DEVICE_DIR/AndroidProducts.mk" "$DEVICE_DIR/twrp_apollo2.mk" "$DEVICE_DIR/vendorsetup.sh"
          ! grep -RInE 'omni_apollo2|vendor/omni/config/common.mk' "$DEVICE_DIR"

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo --output "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP 11 source
        run: |
          set -euo pipefail
          mkdir -p twrp-source
          cd twrp-source
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          mkdir -p .repo/local_manifests
          curl --fail --location https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/twrp-11/remove-minimal.xml --output .repo/local_manifests/remove-minimal.xml
          curl --fail --location https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/twrp-11/twrp-extras.xml --output .repo/local_manifests/twrp-extras.xml

      - name: Sync trimmed TWRP 11 source
        run: |
          set -euo pipefail
          cd twrp-source
          repo sync -c --no-clone-bundle --no-tags -j4
          df -h /

      - name: Add Apollo2 device tree
        run: |
          set -euo pipefail
          mkdir -p twrp-source/device/tcl
          cp -a generated-device-tree/tcl/apollo2 twrp-source/device/tcl/
          test -f twrp-source/device/tcl/apollo2/twrp_apollo2.mk
          test -f twrp-source/vendor/twrp/config/common.mk

      - name: Build TWRP recovery image
        run: |
          set -euo pipefail
          cd twrp-source
          export JAVA_HOME="$PWD/prebuilts/jdk/jdk8/linux-x86"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=0
          java -version
          . build/envsetup.sh
          lunch twrp_apollo2-eng
          mka recoveryimage -j2

      - name: Verify recovery image
        run: |
          set -euo pipefail
          IMAGE="twrp-source/out/target/product/apollo2/recovery.img"
          test -s "$IMAGE"
          SIZE="$(stat --format=%s "$IMAGE")"
          test "$SIZE" -le 33554432
          file "$IMAGE"
          sha256sum "$IMAGE"
          {
            echo "Device: Alcatel 9032X / Apollo_8_4G"
            echo "Codename: apollo2"
            echo "Build: TWRP 11"
            echo "Image size: $SIZE bytes"
            echo "SHA-256:"
            sha256sum "$IMAGE"
          } > twrp-build-info.txt

      - name: Upload TWRP recovery image
        uses: actions/upload-artifact@v4
        with:
          name: alcatel-9032x-twrp-11-recovery
          path: |
            twrp-source/out/target/product/apollo2/recovery.img
            twrp-build-info.txt
          if-no-files-found: error
          retention-days: 14
